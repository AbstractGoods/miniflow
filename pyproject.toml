[build-system]
requires = ["flit_core>=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "miniflow"
version = "0.1.0"
description = "A minimal workflow system for creatives; free and open-source."
readme = "README.md"
authors = [
    { name = "Kevin Neaton", email = "kevin@abstractgoods.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mido>=1.3.0",
    "python-rtmidi>=1.5.8",
]

[project.scripts]
miniflow = "miniflow.main:main"